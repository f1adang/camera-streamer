<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry — Brušocam</title>
<script>
/* Before the first paint, so a remembered theme never flashes the default
   one. h4xx0r is the default here, where the Brushograph WebUI's is plain. */
(function () {
  var t = null;
  try { t = localStorage.getItem("brusocam-theme"); } catch (e) {}
  document.documentElement.dataset.theme = t || "h4xx0r";
  if (t === "kongress") document.documentElement.lang = "de";
})();
</script>
<style>
/* The camera's picture with a FluidNC controller's state laid over it, in the
 * themes of the Brushograph WebUI: the same tokens and the same signature
 * touches, cut down to what this one page has — a bar at the top and the
 * bottom, the picture, the box over it, and a note.
 *
 * The fonts come from Google when the browser can reach it; a camera on a
 * network without the internet falls back to the system's. */
@font-face {
  font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('https://fonts.gstatic.com/s/vt323/v18/pxiKyp0ihIEF2hsY.ttf') format('truetype');
}
@font-face {
  font-family: 'Silkscreen'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('https://fonts.gstatic.com/s/silkscreen/v6/m8JXjfVPf62XiF7kO-i9ULQ.ttf') format('truetype');
}
@font-face {
  font-family: 'Press Start 2P'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('https://fonts.gstatic.com/s/pressstart2p/v16/e3t4euO8T-267oIAQAu6jDQyK0nS.ttf') format('truetype');
}
@font-face {
  font-family: 'UnifrakturMaguntia'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('https://fonts.gstatic.com/s/unifrakturmaguntia/v22/WWXPlieVYwiGNomYU-ciRLRvEmK7oaVunw.ttf') format('truetype');
}
@font-face {
  font-family: 'UnifrakturCook'; font-style: normal; font-weight: 700; font-display: swap;
  src: url('https://fonts.gstatic.com/s/unifrakturcook/v25/IurA6Yli8YOdcoky-0PTTdkm56n05Uw1.ttf') format('truetype');
}

/* ------------------------------------------------------------------ tokens */
:root {
  --ground: #eceeed;
  --sheet: #ffffff;
  --sunk: #f4f6f5;
  --line: #d5d9d8;
  --line-soft: #e6e9e8;
  --ink: #222625;
  --ink-dim: #5d6564;
  --accent: #101211;          /* what the Brushograph WebUI calls --black */
  --bad: #a8321f;
  --on-ground: var(--ink);    /* text straight on the ground, not on a panel */
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
}
/* The default theme follows the machine it is being read on. Every other
   theme is a decision, so it holds whatever the light in the room is doing. */
@media (prefers-color-scheme: dark) {
  :root[data-theme="default"] {
    color-scheme: dark;
    --ground: #161918; --sheet: #1d2120; --sunk: #232726;
    --line: #313736; --line-soft: #272c2b;
    --ink: #e6e9e8; --ink-dim: #9aa3a1; --accent: #f2f4f3; --bad: #e08a7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #161918; --sheet: #1d2120; --sunk: #232726;
  --line: #313736; --line-soft: #272c2b;
  --ink: #e6e9e8; --ink-dim: #9aa3a1; --accent: #f2f4f3; --bad: #e08a7a;
}
/* Husk, flesh and a palm lit from behind. */
:root[data-theme="coconut"] {
  color-scheme: light;
  --ground: #1b2a1c; --sheet: #fdf6e8; --sunk: #f4e8d2;
  --line: #b98a52; --line-soft: #e0cba7;
  --ink: #37220f; --ink-dim: #6b4a2a; --accent: #2f7d32; --bad: #9c2b16;
  --on-ground: #cfe8bd;
  --neon: #6bff3d; --husk: #4a2c18;
}
/* The machine's own theme, from theme-Pinkograph.gz on the controller. */
:root[data-theme="pinkograph"] {
  color-scheme: dark;
  --ground: #0B0014; --sheet: #16032A; --sunk: #2C0857;
  --line: #FF6BB5; --line-soft: #3C0A66;
  --ink: #FFEAF4; --ink-dim: #E3A0C0; --accent: #FF6BB5; --bad: #FF3860;
  --neon: #FF6BB5; --neon-cold: #00F5FF;
}
/* A pink sign with the lights up, and the rainbow in the chrome. */
:root[data-theme="uwu"] {
  color-scheme: dark;
  --ground: #1a0416; --sheet: #2b0824; --sunk: #3a0c2f;
  --line: #ff2d95; --line-soft: #7d1f57;
  --ink: #ffe8f6; --ink-dim: #ffb3de; --accent: #ff2d95; --bad: #ff6b6b;
  --neon: #ff2d95; --neon-2: #ff8ad4;
  --glow: 0 0 6px rgba(255,45,149,.95), 0 0 20px rgba(255,45,149,.7);
  --pride: linear-gradient(90deg, #ff2d95, #ff6b3d, #ffd400, #4ade80, #22d3ee, #a855f7, #ff2d95);
}
/* Stark monochrome print on aged paper, in Fraktur, and in German. */
:root[data-theme="kongress"] {
  color-scheme: light;
  --ground: #dedcd5; --sheet: #f7f6f1; --sunk: #ebe9e1;
  --line: #000000; --line-soft: #555555;
  --ink: #000000; --ink-dim: #2b2b2b; --accent: #000000; --bad: #8b0000;
  --mono: 'UnifrakturMaguntia', 'UnifrakturCook', 'Fraktur', serif;
  --sans: 'UnifrakturMaguntia', 'UnifrakturCook', 'Fraktur', serif;
}
/* The h4xx0r theme of the FluidNC WebUI 3.0 (f1adang/ESP3D-WEBUI, release
 * h4xx0r-theme-v0.1), as ported to the Brushograph WebUI.
 *
 *   ground #020604   panel  #061009   strip #08170c   lit   #0E2E16
 *   ink    #2EE62E   bright #33FF33   hot   #66FF66   dim   #2E9E3A
 *   rule   #1E5A2C   double #1A8C1A   on-green #010A03
 *
 * One green phosphor and nothing else: an error is the hot green in reverse
 * video, not red. */
:root[data-theme="h4xx0r"] {
  color-scheme: dark;
  --ground: #020604; --sheet: #061009; --sunk: #08170c;
  --line: #1e5a2c; --line-soft: #0e2e16;
  --ink: #2ee62e; --ink-dim: #2e9e3a; --accent: #33ff33; --bad: #66ff66;
  --double: #1a8c1a; --phosphor: #33ff33; --hot: #66ff66; --on-green: #010a03;
  --mono: VT323, "Lucida Console", "Courier New", monospace;
  --sans: VT323, "Lucida Console", "Courier New", monospace;
  --pixel: Silkscreen, VT323, "Courier New", monospace;
  --title: "Press Start 2P", VT323, "Courier New", monospace;
  scrollbar-color: #33ff33 #08170c;
  scrollbar-width: thin;
}

/* -------------------------------------------------------------------- page */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; display: flex; flex-direction: column;
  background: var(--ground); color: var(--ink);
  font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-underline-offset: 2px; }

header, footer {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 18px;
  padding: 12px max(16px, calc((100% - 1400px) / 2));
  background: var(--sheet); border: 0 solid var(--line);
}
header { border-bottom-width: 1px; }
footer { margin-top: auto; justify-content: center; border-top-width: 1px; font-size: 13px; color: var(--ink-dim); }
h1 { margin: 0; font-size: 18px; font-weight: 620; letter-spacing: -.015em; }
.sub { margin: 0; color: var(--ink-dim); font-size: 13px; overflow-wrap: anywhere; }
.sub b { color: var(--ink); font-weight: 600; }
header nav { margin-left: auto; font-size: 13px; }
.brand { font-weight: 600; }
.theme-picker { display: flex; align-items: center; gap: 8px; }
.theme-picker select {
  font: inherit; padding: 3px 6px; border-radius: 6px;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--line);
}

main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }

/* The picture and the figures over it are one element, so that full screen
   takes both. As wide as fits the window's height, so the box at the
   picture's foot is never below the fold; --aspect is the stream's. */
.watch {
  position: relative; margin: 0 auto; min-height: 240px; overflow: hidden;
  max-width: max(320px, calc((100vh - 170px) * var(--aspect, 1.7778)));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 6px;
  /* Lettered in proportion to the picture rather than the window, so the
     figures are as legible on a phone as on a screen across the room. */
  container-type: inline-size;
}
.watch img { display: block; width: 100%; height: auto; }
.watch:fullscreen { max-width: none; background: #000; border: 0; border-radius: 0; box-shadow: none; }
.watch:fullscreen img { width: 100%; height: 100%; object-fit: contain; }
.watch-glass { display: none; }
.watch-empty { margin: 0; padding: 40px 24px; max-width: 56ch; text-align: center; color: var(--ink-dim); }

.watch-overlay {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
  padding: .55em .8em; border-radius: 6px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--sheet) 86%, transparent);
  color: var(--ink); font: clamp(12px, 1.7cqi, 30px)/1.3 var(--mono);
}
/* With no picture behind it, it stands in the frame rather than in a corner. */
.watch-overlay.alone { position: static; margin: 24px; }
.watch-overlay p { margin: 0; }
.watch-name { font-weight: 650; letter-spacing: .02em; }
.watch-state b { font-weight: 650; }
.watch-state.bad b { color: var(--bad); }
.watch-state span { color: var(--ink-dim); margin-left: .5em; }
.watch-pos { display: flex; gap: 1.1em; margin: .25em 0 0; }
.watch-pos div { display: flex; gap: .35em; align-items: baseline; }
.watch-pos dt { color: var(--ink-dim); }
/* Wide enough for -123.45 whatever the figure, so the row does not jitter
   five times a second as a digit comes and goes. */
.watch-pos dd { margin: 0; min-width: 7ch; text-align: right; font-size: 1.35em; font-weight: 600; }
.watch-frame { font-size: .78em; color: var(--ink-dim); }
.watch-job { margin-top: .45em; }
.watch-file { overflow-wrap: anywhere; }
.watch-file b { font-weight: inherit; }
.watch-file span { color: var(--ink-dim); margin-left: .5em; }
.watch-bar { height: .4em; margin-top: .3em; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.watch-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.watch-ascii { display: none; white-space: pre; }

button {
  font: inherit; font-size: 13px; cursor: pointer; padding: 5px 11px; border-radius: 6px;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--line);
}
button:hover { border-color: var(--ink-dim); }
.watch-full { position: absolute; right: 12px; top: 12px; opacity: .85; }
.watch:fullscreen .watch-full { display: none; }

.note { margin: 12px 0 0; min-height: 1.5em; font-size: 14px; color: var(--on-ground); opacity: .85; }

@media (max-width: 760px) {
  .watch-overlay { left: 6px; bottom: 6px; max-width: calc(100% - 12px); }
  .watch-pos { gap: .7em; }
  .watch-pos dd { min-width: 6ch; }
  .watch-full { right: 6px; top: 6px; }
}

/* ----------------------------------------------------------------- coconut */
:root[data-theme="coconut"] body {
  background:
    repeating-linear-gradient(103deg, rgba(0,0,0,.13) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(77deg, rgba(0,0,0,.09) 0 1px, transparent 1px 9px),
    var(--ground);
}
:root[data-theme="coconut"] header, :root[data-theme="coconut"] footer { background: var(--husk); border-color: var(--husk); }
:root[data-theme="coconut"] h1 { color: var(--neon); text-shadow: 0 0 14px rgba(107,255,61,.5); }
:root[data-theme="coconut"] h1::after { content: " 🥥"; font-size: .85em; }
:root[data-theme="coconut"] .sub, :root[data-theme="coconut"] .sub b,
:root[data-theme="coconut"] footer, :root[data-theme="coconut"] header nav { color: #cfe8bd; }
:root[data-theme="coconut"] .watch { border-width: 2px; border-radius: 16px; }
:root[data-theme="coconut"] .watch-overlay { border-width: 2px; border-radius: 12px; }

/* -------------------------------------------------------------- pinkograph */
/* The sign across the top humming on 2.6 s, every surface a lit tube. */
:root[data-theme="pinkograph"] body {
  background-color: var(--ground);
  background-image:
    radial-gradient(circle at 12% -5%, rgba(255,107,181,.20), transparent 45%),
    radial-gradient(circle at 88% 105%, rgba(0,245,255,.14), transparent 45%);
  background-attachment: fixed;
}
:root[data-theme="pinkograph"] header {
  background: linear-gradient(90deg, #16032A 0%, #2C0857 50%, #16032A 100%);
  border-bottom: 2px solid rgba(255,107,181,.9);
  animation: pk-hum 2.6s ease-in-out infinite;
}
:root[data-theme="pinkograph"] footer {
  background: linear-gradient(90deg, #16032A 0%, #2C0857 50%, #16032A 100%);
  border-top: 2px solid rgba(255,107,181,.9);
  animation: pk-hum-up 2.6s ease-in-out infinite;
}
:root[data-theme="pinkograph"] h1,
:root[data-theme="pinkograph"] .watch-name,
:root[data-theme="pinkograph"] .watch-pos dd {
  color: var(--neon);
  text-shadow: 0 0 6px rgba(255,107,181,.95), 0 0 18px rgba(255,107,181,.55);
}
:root[data-theme="pinkograph"] .watch, :root[data-theme="pinkograph"] .watch-overlay {
  border: 1px solid rgba(255,107,181,.75);
  box-shadow: 0 0 10px rgba(255,107,181,.48), 0 0 26px rgba(255,107,181,.26),
              inset 0 0 16px rgba(255,107,181,.10);
}
:root[data-theme="pinkograph"] .watch-overlay { background: rgba(22,3,42,.86); }
:root[data-theme="pinkograph"] .watch-bar i { background: linear-gradient(90deg, var(--neon), var(--neon-cold)); }
:root[data-theme="pinkograph"] button, :root[data-theme="pinkograph"] .theme-picker select {
  background: #2C0857; border-color: var(--neon); color: var(--ink);
}
:root[data-theme="pinkograph"] button { text-shadow: 0 0 7px rgba(255,107,181,.45); animation: pk-tube-hum 2.6s ease-in-out infinite; }
:root[data-theme="pinkograph"] button:hover { background: #3C0A66; color: var(--neon); }
@keyframes pk-hum {
  0%, 100% { box-shadow: 0 2px 10px rgba(255,107,181,.45), 0 2px 26px rgba(255,107,181,.20); }
  50%      { box-shadow: 0 2px 18px rgba(255,107,181,.85), 0 2px 44px rgba(255,107,181,.40); }
}
@keyframes pk-hum-up {
  0%, 100% { box-shadow: 0 -2px 10px rgba(255,107,181,.45), 0 -2px 26px rgba(255,107,181,.20); }
  50%      { box-shadow: 0 -2px 18px rgba(255,107,181,.85), 0 -2px 44px rgba(255,107,181,.40); }
}
@keyframes pk-tube-hum {
  0%, 100% { box-shadow: inset 0 0 8px rgba(255,107,181,.08), 0 0 5px rgba(255,107,181,.18); border-color: rgba(255,107,181,.55); }
  50%      { box-shadow: inset 0 0 18px rgba(255,107,181,.30), 0 0 26px rgba(255,107,181,.75); border-color: #FFA6D4; }
}

/* --------------------------------------------------------------------- uwu */
:root[data-theme="uwu"] body {
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,45,149,.30), transparent 65%),
    radial-gradient(90% 60% at 15% 110%, rgba(168,85,247,.26), transparent 60%),
    var(--ground);
  background-attachment: fixed;
}
:root[data-theme="uwu"] header, :root[data-theme="uwu"] footer {
  background: rgba(43,8,36,.92); border-color: var(--neon); box-shadow: 0 0 24px -6px var(--neon);
}
:root[data-theme="uwu"] h1 {
  background: var(--pride); background-size: 320% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 9px rgba(255,45,149,.85));
  animation: pride-run 9s linear infinite, neon-flicker 6s infinite steps(1);
}
:root[data-theme="uwu"] .watch, :root[data-theme="uwu"] .watch-overlay {
  box-shadow: 0 0 0 1px rgba(255,45,149,.5), 0 0 26px -10px var(--neon),
              inset 0 0 30px -22px var(--neon-2);
}
:root[data-theme="uwu"] .watch-overlay { background: rgba(43,8,36,.86); }
:root[data-theme="uwu"] .watch-name { color: #fff; text-shadow: var(--glow); }
:root[data-theme="uwu"] .watch-pos dd { color: var(--neon-2); text-shadow: 0 0 8px rgba(255,138,212,.55); }
:root[data-theme="uwu"] .watch-bar i { background: var(--pride); background-size: 320% 100%; animation: pride-run 6s linear infinite; }
:root[data-theme="uwu"] button, :root[data-theme="uwu"] .theme-picker select { background: var(--sunk); border-color: var(--neon); }
@keyframes pride-run { to { background-position: 320% 0; } }
@keyframes neon-flicker {
  0%, 3%, 6%, 41%, 44%, 100% { opacity: 1; }
  2%, 5%, 42% { opacity: .45; }
}

/* ---------------------------------------------------------------- kongress */
:root[data-theme="kongress"] body { font-size: 16px; line-height: 1.6; }
:root[data-theme="kongress"] * { border-radius: 0; }
:root[data-theme="kongress"] h1, :root[data-theme="kongress"] .watch-name {
  font-family: 'UnifrakturCook', 'UnifrakturMaguntia', 'Fraktur', serif;
  font-weight: 700; letter-spacing: .04em;
}
:root[data-theme="kongress"] h1 { font-size: 22px; }
:root[data-theme="kongress"] header { border-bottom: 3px double #000; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
:root[data-theme="kongress"] footer { border-top: 3px double #000; box-shadow: 0 -2px 0 rgba(0,0,0,.08); }
:root[data-theme="kongress"] .watch { border: 2px solid #000; box-shadow: 3px 3px 0 #000; }
:root[data-theme="kongress"] .watch-overlay { border: 2px solid #000; box-shadow: 2px 2px 0 #000; background: rgba(247,246,241,.92); }
:root[data-theme="kongress"] button, :root[data-theme="kongress"] .theme-picker select {
  background: var(--sheet); color: #000; border: 1.5px solid #000; box-shadow: 1px 1px 0 #000;
}
:root[data-theme="kongress"] button:hover { background: #000; color: #fff; }

/* ------------------------------------------------------------------ h4xx0r */
/* The glass is four layers over the whole page: scanlines and a vignette
 * that flicker (body::after), green static that drifts and thickens during a
 * glitch (html::before), short dropout streaks (body::before) and a band of
 * interference that rolls up the screen (html::after). The page loses the
 * signal on a 9 s cycle, jitters a pixel at a time and powers on from a
 * line. Full screen is the top layer, out from under all of that, so the
 * picture carries the same four layers and the same glitches with it. */
:root[data-theme="h4xx0r"] * { font-synthesis: none; letter-spacing: .03em; border-radius: 0; }
:root[data-theme="h4xx0r"] body {
  font-size: 20px; line-height: 1.3;
  background-color: var(--ground);
  background-image: radial-gradient(ellipse at 50% 45%, rgba(51,255,51,.09) 0,
                                    rgba(51,255,51,.02) 50%, transparent 80%);
  background-attachment: fixed;
  text-shadow: 0 0 1px rgba(51,255,51,.9), 1px 0 1px rgba(51,255,51,.35),
               0 0 6px rgba(51,255,51,.45);
}
:root[data-theme="h4xx0r"] ::selection { background: var(--phosphor); color: var(--on-green); text-shadow: none; }
:root[data-theme="h4xx0r"] a { color: var(--phosphor); }
:root[data-theme="h4xx0r"] a:hover { color: var(--hot); }
:root[data-theme="h4xx0r"] header, :root[data-theme="h4xx0r"] footer { background: var(--sunk); border-color: var(--phosphor); }
:root[data-theme="h4xx0r"] header { box-shadow: 0 1px 12px rgba(51,255,51,.35); }
:root[data-theme="h4xx0r"] footer { box-shadow: 0 -1px 12px rgba(51,255,51,.35); font-size: 17px; }
:root[data-theme="h4xx0r"] header nav, :root[data-theme="h4xx0r"] .sub { font-size: 20px; }
:root[data-theme="h4xx0r"] .sub b { font-weight: 400; color: var(--phosphor); }
:root[data-theme="h4xx0r"] footer .brand,
:root[data-theme="h4xx0r"] .theme-picker > span { font: 12px var(--pixel); letter-spacing: .05em; color: var(--phosphor); }
:root[data-theme="h4xx0r"] h1 {
  font: 400 18px/1.6 var(--title); letter-spacing: .05em; text-transform: uppercase;
  color: var(--phosphor); text-shadow: 0 0 6px rgba(51,255,51,.7);
  animation: h4x-smear 6.1s infinite;
}
:root[data-theme="h4xx0r"] h1::after { content: "\2588"; margin-left: .3em; animation: h4x-blink 1s steps(1) infinite; }

:root[data-theme="h4xx0r"] .watch, :root[data-theme="h4xx0r"] .watch-overlay {
  border: 3px double var(--double);
  box-shadow: 0 0 0 1px rgba(51,255,51,.15), 0 0 18px rgba(51,255,51,.12),
              inset 0 0 24px rgba(51,255,51,.04);
}
:root[data-theme="h4xx0r"] .watch:fullscreen { border: 0; box-shadow: none; }
:root[data-theme="h4xx0r"] .watch-overlay {
  padding: .4em .7em .5em; background: rgba(6,16,9,.84);
  font: clamp(17px, 2.3cqi, 40px)/1.15 var(--mono);
}
:root[data-theme="h4xx0r"] .watch-name { font: .75em/1.5 var(--pixel); color: var(--phosphor); letter-spacing: .08em; }
:root[data-theme="h4xx0r"] .watch-state { text-transform: uppercase; }
:root[data-theme="h4xx0r"] .watch-state b { font-weight: 400; color: var(--phosphor); }
:root[data-theme="h4xx0r"] .watch-state b::before { content: "> "; }
:root[data-theme="h4xx0r"] .watch-state.bad b {
  background: var(--hot); color: var(--on-green); text-shadow: 0 0 6px rgba(102,255,102,.6); padding: 0 .25em;
}

<body>
<header>

        <div><dt>Y</dt><dd id="watch-y">–</dd></div>

</main>
<footer>
  <span class="brand">Brušocam</span> <span id="version"></span>
  <a href="control">/control</a> <a href="status">/status</a>
  <label class="theme-picker">
    <span data-t>Theme</span>
    <select id="theme-select">
      <option value="default" data-t>Default</option>
      <option value="dark" data-t>Dark mode</option>
      <option value="coconut" data-t>Coconut mode</option>
      <option value="pinkograph">Pinkograph</option>
      <option value="uwu">UwU</option>
      <option value="kongress">𝕭𝖗𝖚𝖘𝖈𝖍𝖔𝖑𝖔𝖌𝖎𝖘𝖈𝖍𝖊𝖗 𝕶𝖔𝖓𝖌𝖗𝖊𝖘𝖘</option>
      <option value="h4xx0r">h4xx0r</option>
    </select>
  </label>
</footer>

<script>
/* The camera's picture with a FluidNC controller's state over it: its name,
 * the state (Running, Paused, Alarm …), the feed, X, Y and Z, the file and
 * how far through it the card has read.
 *
 * The controller is -fluidnc-url, and Brušocam talks to it, not this page:
 * the browser may be outside, through a proxy, where the controller cannot be
 * reached. /fluidnc relays its status reports as server-sent events, one
 * long-lived response as /stream is, with the latest report and the work
 * offset, which the controller sends only every few reports. An event comes
 * at least every second, so silence means Brušocam has gone, and the
 * browser's EventSource reconnects by itself. */
const QUIET_MS = 5000;                     // no event this long, and it says so
const CAMERA_RETRY_MS = 10000;
const CAMERA_FIRST_MS = 8000;              // no picture by then, and it is down
const BAR_CELLS = 24;
const THEME_KEY = "brusocam-theme";

const $ = (id) => document.getElementById(id);

/* ---- language ---- */
/* The Kongress theme speaks German, as it does in the Brushograph WebUI, in
 * the same words. Everything said goes through say(), which remembers the
 * English, so a change of theme can say it again in the other language. */
const DE = {
  "Telemetry": "Telemetrie",
  "Telemetry — Brušocam": "Telemetrie — Brušocam",
  "← index": "← Übersicht",
  "Full screen": "Vollbild",
  "Theme": "Erscheinungsbild",
  "Default": "Standard",
  "Dark mode": "Dunkelmodus",
  "Coconut mode": "Kokosnussmodus",
  "The camera's picture of the machine": "Das Kamerabild der Maschine",
  "Connecting…": "Verbinde …",
  "Idle": "Bereit",
  "Running": "In Arbeit",
  "Jogging": "Verfahren von Hand",
  "Homing": "Referenzfahrt",
  "Alarm": "Alarm",
  "Checking G-code": "Prüfung der Maschinensteuerbefehle",
  "Asleep": "Ruhezustand",
  "Paused": "Angehalten",
  "Pausing…": "Hält an …",
  "Door open": "Tür offen",
  "Not connected": "Nicht verbunden",
  "work coordinates": "Werkstückkoordinaten",
  "machine coordinates": "Maschinenkoordinaten",
  "{pct}%": "{pct} %",
  "{bar} {pct}%": "{bar} {pct} %",
  "{file} · all sent": "{file} · vollständig übertragen",
  "{file} · stopped at {pct}%": "{file} · abgebrochen bei {pct} %",
  "Watching {machine}.": "{machine} wird beobachtet.",
  "{error}. Brušocam keeps trying.": "{error}. Brušocam versucht es weiter.",
  "Brušocam is connecting to {machine}.": "Brušocam verbindet sich mit {machine}.",
  "Brušocam is not answering. Trying again.": "Brušocam antwortet nicht. Neuer Versuch.",
  "No FluidNC controller is set, so this is the camera alone. Start Brušocam with -fluidnc-url= to see one here.":
    "Keine FluidNC-Steuerung angegeben, daher nur das Kamerabild. Starten Sie Brušocam mit -fluidnc-url=, um hier eine zu sehen.",
  "This Brušocam has its MJPEG stream turned off (-camera-stream.disabled), so there is no picture to show.":
    "Bei dieser Brušocam ist der MJPEG-Datenstrom abgeschaltet (-camera-stream.disabled), daher gibt es kein Bild.",
  "No picture from the camera. Trying again every {seconds} seconds.":
    "Kein Bild von der Kamera. Neuer Versuch alle {seconds} Sekunden.",
};
const german = () => document.documentElement.dataset.theme === "kongress";
const said = new Map();

function t(text, vars) {
  const s = german() && DE[text] ? DE[text] : text;
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k]) : s;
}
function say(node, text, vars) {
  said.set(node, [text, vars]);
  node.textContent = t(text, vars);
}
function sayAgain() {
  document.documentElement.lang = german() ? "de" : "en";
  document.title = t("Telemetry — Brušocam");
  for (const [node, [text, vars]] of said) node.textContent = t(text, vars);
  $("watch-video").alt = t("The camera's picture of the machine");
}
// The page's own words, kept in English to say again on a change of theme.
for (const node of document.querySelectorAll("[data-t]")) say(node, node.textContent);

/* ---- themes ---- */
(function themes() {
  const sel = $("theme-select");
  sel.value = document.documentElement.dataset.theme;
  sel.addEventListener("change", () => {
    document.documentElement.dataset.theme = sel.value;
    try { localStorage.setItem(THEME_KEY, sel.value); } catch (e) {}
    sayAgain();
  });
  sayAgain();
})();

/* ---- the reports ---- */
/* "<Run|MPos:1,2,3|FS:494,0|SD:65.13,/sd/a.gcode>" -> {state: "Run", MPos: "1,2,3", …}.
   Split on the first colon only: "Hold:0" is a state, and SD can carry one. */
function parseStatus(line) {
  const [state, ...fields] = line.slice(1, -1).split("|");
  const out = { state };
  for (const f of fields) {
    const at = f.indexOf(":");
    if (at > 0) out[f.slice(0, at)] = f.slice(at + 1);
  }
  return out;
}

const axesOf = (s) => s.split(",").slice(0, 3).map(Number);

/* "65.13,/sd/a.gcode" while a file runs; "/sd/a.gcode: Sent" for the moment it
   is opened, before there is a percentage to give. */
function jobOf(sd) {
  let m = /^\s*([\d.]+),(.*)$/.exec(sd);
  if (m) return { pct: Number(m[1]), file: m[2].replace(/^.*\//, "") };
  m = /^\s*(.*?):\s*Sent\s*$/.exec(sd);
  return { pct: 0, file: (m ? m[1] : sd).trim().replace(/^.*\//, "") };
}

/* What FluidNC calls a state, in words. Hold:1 is a pause still slowing down;
   Hold:0 is one that has stopped. */
const STATES = {
  Idle: "Idle", Run: "Running", Jog: "Jogging", Home: "Homing", Alarm: "Alarm",
  Check: "Checking G-code", Sleep: "Asleep", Hold: "Paused", "Hold:1": "Pausing…",
  Door: "Door open",
};
const BAD = new Set(["Alarm", "Door"]);

/* Two decimals, and never "-0.00": a figure that flickers its sign at rest
   reads as movement. */
function mm(v) {
  const s = v.toFixed(2);
  return s === "-0.00" ? "0.00" : s;
}

/* [██████████░░░░░░░░░░░░░░] — the bar as the h4xx0r terminal draws it. */
function asciiBar(pct) {
  const full = Math.round(Math.min(100, Math.max(0, pct)) / 100 * BAR_CELLS);
  return "[" + "█".repeat(full) + "░".repeat(BAR_CELLS - full) + "]";
}

/* "http://testikel.local:80/" -> "testikel.local", for the header, and
   "testikel" for the box, unless -fluidnc-name names it otherwise. */
const hostOf = (url) => url.replace(/^[a-z]+:\/\//, "").replace(/\/.*$/, "");
const nameOf = (host) => host.replace(/:\d+$/, "").replace(/\.local$/, "");

(async function watch() {
  const fig = $("watch");
  const img = $("watch-video");
  const empty = $("watch-empty");
  const overlay = $("watch-overlay");
  const note = $("watch-note");
  const stateLine = fig.querySelector(".watch-state");
  const show = {
    name: $("watch-name"), state: $("watch-state"), feed: $("watch-feed"), frame: $("watch-frame"),
    x: $("watch-x"), y: $("watch-y"), z: $("watch-z"),
    job: $("watch-job"), file: $("watch-file"), pct: $("watch-pct"),
    bar: $("watch-bar"), ascii: $("watch-ascii"),
  };
  say(show.state, "Connecting…");

  // What this camera was started with.
  let status = {};
  try {
    const res = await fetch("status", { cache: "no-store" });
    if (res.ok) status = await res.json();
  } catch (e) { /* the stream may still be there; the events will say */ }
  if (status.version) $("version").textContent = status.version;

  const fluidnc = status.fluidnc || {};
  const host = fluidnc.url ? hostOf(fluidnc.url) : "";
  const machine = fluidnc.name || nameOf(host);
  const streamOn = !(status.outputs && status.outputs.stream && status.outputs.stream.enabled === false);

  if (host) {
    const sub = $("sub");
    sub.append(" · FluidNC ");
    const b = document.createElement("b");
    b.textContent = host;
    sub.append(b);
    show.name.textContent = machine;
  }

  const full = $("watch-full");
  if (fig.requestFullscreen) {
    full.hidden = false;
    full.addEventListener("click", () => fig.requestFullscreen().catch(() => {}));
  }

  /* ---- the camera ---- */
  /* /stream is MJPEG, which an <img> shows in every browser. /webrtc is lower
     latency, but an iframe cannot have the box laid over it and still go
     full screen with it. */
  let cameraRetry = null;
  function fitTo(w, h) {
    if (w > 0 && h > 0) fig.style.setProperty("--aspect", w / h);
  }
  const stream = status.outputs && status.outputs.stream;
  if (stream) fitTo(stream.width, stream.height);
  function cameraAlone(alone, text, vars) {
    img.hidden = alone;
    empty.hidden = !alone;
    overlay.classList.toggle("alone", alone);
    if (alone) say(empty, text, vars);
  }
  function startCamera() {
    clearTimeout(cameraRetry);
    if (!streamOn) {
      cameraAlone(true, "This Brušocam has its MJPEG stream turned off "
        + "(-camera-stream.disabled), so there is no picture to show.");
      return;
    }
    // The picture's own shape, from the first frame, which is the stream's
    // whatever /status said about it.
    img.onload = () => fitTo(img.naturalWidth, img.naturalHeight);
    const failed = () => {
      clearTimeout(cameraRetry);
      img.onerror = null;
      img.removeAttribute("src");
      cameraAlone(true, "No picture from the camera. Trying again every {seconds} seconds.",
        { seconds: CAMERA_RETRY_MS / 1000 });
      cameraRetry = setTimeout(startCamera, CAMERA_RETRY_MS);
    };
    img.onerror = failed;
    // A fresh URL each time, or a retry is answered from the failure.
    img.src = `stream?t=${Date.now()}`;
    cameraAlone(false);
    // A camera that has stopped delivering frames leaves the stream open and
    // empty. A stream that has sent no picture by now is taken as not there.
    cameraRetry = setTimeout(() => {
      if (!img.naturalWidth) failed();
      else fitTo(img.naturalWidth, img.naturalHeight);
    }, CAMERA_FIRST_MS);
  }
  function stopCamera() {
    clearTimeout(cameraRetry);
    img.onerror = null;
    // Emptying src is what closes the stream; a hidden <img> keeps pulling it.
    img.removeAttribute("src");
  }

  /* ---- the machine ---- */
  let events = null;
  let eventAt = 0;
  let job = null;       // the last file seen running, kept after it ends

  function sayState(text, bad) {
    say(show.state, text);
    stateLine.classList.toggle("bad", !!bad);
  }

  function showJob(pct) {
    say(show.pct, "{pct}%", { pct: pct.toFixed(1) });
    show.bar.style.width = `${Math.min(100, pct)}%`;
    say(show.ascii, "{bar} {pct}%", { bar: asciiBar(pct), pct: pct.toFixed(1) });
  }

  function heard(line, wcoText) {
    if (!/^<.*>$/.test(line)) return;
    const s = parseStatus(line);
    const kind = s.state.split(":")[0];
    sayState(STATES[s.state] || STATES[kind] || s.state, BAD.has(kind));
    const feed = s.FS ? Number(s.FS.split(",")[0]) : s.F ? Number(s.F) : 0;
    show.feed.textContent = feed > 0 ? `${Math.round(feed)} mm/min` : "";

    // Work coordinates, which are the figures in the G-code: what the machine
    // reports is its own position, and the offset between comes now and then,
    // kept by Brušocam from the last report that had it.
    const wco = wcoText ? axesOf(wcoText) : null;
    let pos = null;
    if (s.WPos) {
      pos = axesOf(s.WPos);
      say(show.frame, "work coordinates");
    } else if (s.MPos && wco) {
      pos = axesOf(s.MPos).map((v, i) => v - (wco[i] || 0));
      say(show.frame, "work coordinates");
    } else if (s.MPos) {
      pos = axesOf(s.MPos);
      say(show.frame, "machine coordinates");
    }
    if (pos) {
      show.x.textContent = mm(pos[0]);
      show.y.textContent = mm(pos[1]);
      show.z.textContent = pos.length > 2 ? mm(pos[2]) : "–";
    }

    if (s.SD !== undefined) {
      job = { ...jobOf(s.SD), running: true };
      say(show.file, job.file);
      showJob(job.pct);
      show.job.hidden = false;
    } else if (job && job.running) {
      // The report stops naming the file the moment it is closed, at the end
      // or at a reset; how far it had got says which. SD is the share *read*,
      // which runs ahead of the tool by what the planner holds, so the last
      // few moves may still be under way, and the state above says so.
      job.running = false;
      if (job.pct >= 99) {
        say(show.file, "{file} · all sent", { file: job.file });
        showJob(100);
      } else {
        say(show.file, "{file} · stopped at {pct}%", { file: job.file, pct: job.pct.toFixed(1) });
      }
    } else if (!job) {
      show.job.hidden = true;
    }
  }

  function onEvent(ev) {
    eventAt = Date.now();
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.connected) {
      say(note, "Watching {machine}.", { machine });
      if (d.status) heard(d.status, d.wco);
    } else if (d.error) {
      sayState("Not connected", true);
      say(note, "{error}. Brušocam keeps trying.", { error: d.error });
    } else {
      sayState("Connecting…");
      say(note, "Brušocam is connecting to {machine}.", { machine });
    }
  }

  function startMachine() {
    if (!host) {
      overlay.hidden = true;
      say(note, "No FluidNC controller is set, so this is the camera alone. "
        + "Start Brušocam with -fluidnc-url= to see one here.");
      return;
    }
    overlay.hidden = false;
    eventAt = Date.now();
    events = new EventSource("fluidnc");
    events.onmessage = onEvent;
  }

  function stopMachine() {
    if (events) events.close();
    events = null;
  }

  // Every second there is an event, changed or not; none for a while, and
  // Brušocam itself is not answering. EventSource tries again.
  setInterval(() => {
    if (events && Date.now() - eventAt > QUIET_MS) {
      sayState("Not connected", true);
      say(note, "Brušocam is not answering. Trying again.");
    }
  }, 1000);

  // A tab nobody is looking at stops pulling a stream off the camera, which
  // is a megabyte or so a second, and stops watching, so Brušocam can give
  // the controller its socket back.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopMachine();
      stopCamera();
    } else {
      startCamera();
      startMachine();
    }
  });

  startCamera();
  startMachine();
})();
</script>
</body>
</html>
